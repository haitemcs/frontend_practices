<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Verte | Product</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <article class="product-card">
            <div class="image-container">
                <img src="shirt.jpg" alt="T-shirt Bio">
                <span class="badge">100% BIO</span>
            </div>

            <div class="product-info">
                <p class="category">COLLECTION ESSENTIELLE</p>
                <h1>T-shirt Bio</h1>

                <div class="purchase-info">
                    <p class="price">19,99 <span>euro</span></p>
                    <span class="availability">En stock</span>
                </div>

                <button class="buy-button">
                    Buy
                    <span aria-hidden="true">→</span>
                </button>
            </div>
        </article>
    </main>
</body>
</html>
